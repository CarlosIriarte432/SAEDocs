<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - SAEDocs</title>
  <link rel="icon" type="image/png" href="./img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Guardián de Autenticación y Rol -->
  <script>
    const token = localStorage.getItem('saedocs_token');
    const userStr = localStorage.getItem('saedocs_user');
    
    if (!token || !userStr) {
      window.location.href = 'login.html';
    } else {
      const user = JSON.parse(userStr);
      if (user.role !== 'admin') {
        window.location.href = 'index.html'; // Expulsa a usuarios normales al dashboard
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

  <!-- Header -->
  <header class="w-full bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-4">
      <img src="./img/saedocslogo.png" alt="SAEDocs" class="h-8 object-contain">
      <span class="bg-slate-900 text-white text-xs font-bold px-2 py-1 rounded">PANEL ADMIN</span>
    </div>
    
    <div class="flex items-center gap-4 text-sm">
      <a href="index.html" class="font-medium text-blue-600 hover:text-blue-800">Volver al Buscador</a>
      <span class="text-slate-300">|</span>
      <span class="text-slate-500">Admin: <span id="adminName" class="font-bold text-slate-800">--</span></span>
      <span class="text-slate-300">|</span>
      <button onclick="cerrarSesion()" class="font-bold text-rose-600 hover:text-rose-800 transition-colors">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
    
    <!-- Columna Izquierda: Formulario para Agregar -->
    <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
      <h2 class="text-lg font-bold text-slate-900 mb-4">Registrar Vehículo</h2>
      
      <form id="addVehicleForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Patente</label>
          <input type="text" id="plate" required placeholder="Ej: CJBB63" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-slate-900 outline-none uppercase">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tipo</label>
          <select id="type" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-slate-900 outline-none">
            <option value="Camión">Camión</option>
            <option value="Semirremolque">Semirremolque</option>
            <option value="Camioneta">Camioneta</option>
            <option value="Maquinaria">Maquinaria</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">N° Interno (Opcional)</label>
          <input type="text" id="internal_number" placeholder="Ej: TRK-01" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-1 focus:ring-slate-900 outline-none">
        </div>

        <p id="formMsg" class="hidden text-sm text-center py-2 rounded-lg"></p>

        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg hover:bg-slate-800 transition-colors shadow-sm">
          Añadir a la Flota
        </button>
      </form>
    </div>

    <!-- Columna Derecha: Lista de Vehículos -->
    <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-900">Inventario de Flota</h2>
        <span id="totalVehicles" class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">0 vehículos</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
              <th class="px-4 py-3 font-semibold">Patente</th>
              <th class="px-4 py-3 font-semibold">Tipo</th>
              <th class="px-4 py-3 font-semibold">N° Interno</th>
              <th class="px-4 py-3 font-semibold text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="vehicleTableBody" class="divide-y divide-slate-100">
            <!-- Las filas se inyectan aquí con JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Confirmar Eliminación -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center transform transition-all">
      <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-rose-100 mb-4">
        <svg class="h-7 w-7 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <h3 class="text-xl font-bold text-slate-900 mb-2">¿Eliminar Vehículo?</h3>
      <p class="text-sm text-slate-500 mb-6">Estás a punto de eliminar la patente <span id="deleteModalPlate" class="font-bold text-slate-900 text-base uppercase"></span>. Esta acción no se puede deshacer y desvinculará sus documentos.</p>
      <div class="flex gap-3 justify-center">
        <button onclick="closeDeleteModal()" class="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-semibold hover:bg-slate-200 transition-colors w-full">Cancelar</button>
        <button id="confirmDeleteBtn" class="px-4 py-2.5 bg-rose-600 text-white rounded-xl font-semibold hover:bg-rose-700 transition-colors w-full shadow-sm">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal Éxito / Notificación -->
  <div id="notificationModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center transform transition-all">
      <div id="notifIconContainer" class="mx-auto flex items-center justify-center h-14 w-14 rounded-full mb-4">
        <!-- Icono inyectado dinámicamente -->
      </div>
      <h3 id="notifTitle" class="text-xl font-bold text-slate-900 mb-2">--</h3>
      <p id="notifMessage" class="text-sm text-slate-500 mb-6">--</p>
      <button onclick="closeNotificationModal()" class="w-full px-4 py-2.5 bg-slate-900 text-white rounded-xl font-semibold hover:bg-slate-800 transition-colors shadow-sm">Entendido</button>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3000/api/admin/vehicles';
    const authHeaders = {
      'Authorization': `Bearer ${localStorage.getItem('saedocs_token')}`,
      'Content-Type': 'application/json'
    };

    let vehicleToDeleteId = null; // Guarda el ID del vehículo a borrar

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('saedocs_user'));
      document.getElementById('adminName').textContent = user.name;
      loadVehicles();
    });

    function cerrarSesion() {
      localStorage.removeItem('saedocs_token');
      localStorage.removeItem('saedocs_user');
      window.location.href = 'login.html';
    }

    // Cargar vehículos
    async function loadVehicles() {
      try {
        const response = await fetch(API_URL, { headers: authHeaders });
        const result = await response.json();
        
        if (result.success) {
          renderTable(result.data);
          document.getElementById('totalVehicles').textContent = `${result.data.length} vehículos`;
        }
      } catch (error) {
        console.error('Error cargando vehículos:', error);
      }
    }

    // Renderizar la tabla
    function renderTable(vehicles) {
      const tbody = document.getElementById('vehicleTableBody');
      tbody.innerHTML = '';
      
      vehicles.forEach(v => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-3 font-bold text-slate-800">${v.plate}</td>
          <td class="px-4 py-3 text-sm text-slate-600">${v.type}</td>
          <td class="px-4 py-3 text-sm text-slate-600">${v.internal_number || '-'}</td>
          <td class="px-4 py-3 text-right">
            <button onclick="deleteVehicle(${v.id}, '${v.plate}')" class="text-rose-500 hover:text-rose-700 font-medium text-sm px-2 py-1 rounded hover:bg-rose-50 transition-colors">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- LÓGICA DE MODALES DE NOTIFICACIÓN ---
    function showNotification(title, message, type) {
      document.getElementById('notifTitle').textContent = title;
      document.getElementById('notifMessage').textContent = message;
      
      const iconContainer = document.getElementById('notifIconContainer');
      if (type === 'success') {
        iconContainer.className = 'mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-emerald-100 mb-4 text-emerald-600';
        iconContainer.innerHTML = `<svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
      } else {
        iconContainer.className = 'mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-rose-100 mb-4 text-rose-600';
        iconContainer.innerHTML = `<svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
      }
      
      document.getElementById('notificationModal').classList.remove('hidden');
    }

    function closeNotificationModal() {
      document.getElementById('notificationModal').classList.add('hidden');
    }

    // --- LÓGICA DE AGREGAR VEHÍCULO ---
    document.getElementById('addVehicleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        plate: document.getElementById('plate').value,
        type: document.getElementById('type').value,
        internal_number: document.getElementById('internal_number').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: authHeaders,
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        if (response.ok) {
          document.getElementById('addVehicleForm').reset();
          showNotification('Flota Actualizada', `La patente ${payload.plate.toUpperCase()} fue registrada con éxito.`, 'success');
          loadVehicles(); // Recargar la tabla
        } else {
          throw new Error(result.error);
        }
      } catch (error) {
        showNotification('Error de Registro', error.message, 'error');
      }
    });

    // --- LÓGICA DE ELIMINAR VEHÍCULO ---
    function deleteVehicle(id, plate) {
      vehicleToDeleteId = id; // Guardamos el ID en memoria
      document.getElementById('deleteModalPlate').textContent = plate;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      vehicleToDeleteId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!vehicleToDeleteId) return;
      
      try {
        const response = await fetch(`${API_URL}/${vehicleToDeleteId}`, {
          method: 'DELETE',
          headers: authHeaders
        });
        
        if (response.ok) {
          closeDeleteModal();
          showNotification('Vehículo Eliminado', 'El registro ha sido borrado del sistema.', 'success');
          loadVehicles();
        } else {
          throw new Error('Error al procesar la solicitud.');
        }
      } catch (error) {
        closeDeleteModal();
        showNotification('Error', 'Hubo un problema al intentar eliminar el vehículo.', 'error');
      }
    });
  </script>
</body>
</html>
